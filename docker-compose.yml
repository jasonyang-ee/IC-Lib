services:
  iclib:
    image: iclib:latest
    container_name: iclib
    restart: unless-stopped
    ports:
      - "80:80"          # All traffic (frontend + API via nginx proxy)
    environment:
      # Authentication Settings
      - JWT_SECRET=change-this-to-a-secure-random-string-in-production-minimum-32-characters
      - CONFIG_ECO=false
      - CONFIG_BASE_URL=http://localhost:80
      # - CONFIG_SUBDIRECTORY_PATH=/
      
      # Database Connection (External PostgreSQL)
      # Update these to match your PostgreSQL server
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=iclib
      - DB_PASSWORD=change-this-to-a-secure-db-password-minimum-6-characters
      - DB_NAME=iclib
      
      # Optional: API Keys for vendor integrations
      # - DIGIKEY_CLIENT_ID=your_client_id
      # - DIGIKEY_CLIENT_SECRET=your_client_secret
      # - MOUSER_API_KEY=your_api_key

      # Optional: rate limiting (SPEC V32). Defaults apply when unset: three
      # independent budgets - failed logins per client IP, failed
      # change-password attempts per authenticated user id, and a coarse per-IP
      # ceiling over only the public read surface plus the barcode lookup.
      # Counters are process-local: this compose file runs ONE app container,
      # which is what makes them authoritative. Scale the app past one process
      # or replica and you need a shared external store first.
      # TRUST_PROXY_HOPS is the number of proxy hops in front of Node (1 for
      # the bundled nginx) so the limiters key on the real client address.
      # - TRUST_PROXY_HOPS=1
      # - RATE_LIMIT_LOGIN_MAX=10
      # - RATE_LIMIT_LOGIN_WINDOW_MS=900000
      # - RATE_LIMIT_CHANGE_PASSWORD_MAX=10
      # - RATE_LIMIT_CHANGE_PASSWORD_WINDOW_MS=900000
      # - RATE_LIMIT_GLOBAL_MAX=1000
      # - RATE_LIMIT_GLOBAL_WINDOW_MS=900000

      # Optional: OIDC / SSO (enabled iff issuer + client id are set).
      # Redirect URI must be this deployment's public URL + /api/auth/oidc/callback
      # (include the subdirectory if CONFIG_SUBDIRECTORY_PATH is set).
      # Note: schema timestamps are timezone-naive; server and DB assume one site TZ.
      # OIDC_ALLOWED_TENANTS defaults empty (no tenant-claim filter). Exact Microsoft
      # Entra /common or /organizations issuers require a nonempty comma-separated
      # tenant-ID allowlist; tenant-specific Entra and generic OIDC can leave it unset.
      # - OIDC_ISSUER_URL=https://idp.example.com/realms/company
      # - OIDC_CLIENT_ID=iclib
      # - OIDC_CLIENT_SECRET=your_client_secret
      # - OIDC_REDIRECT_URI=http://localhost:80/api/auth/oidc/callback
      # - OIDC_SCOPES=openid profile email
      # - OIDC_PROVIDER_NAME=Company SSO
      # - OIDC_DEFAULT_ROLE=read-only
      # - OIDC_ALLOWED_TENANTS=00000000-0000-0000-0000-000000000000

      # Optional: Entra SCIM provisioning (enabled iff BOTH variables are set;
      # a partial or invalid setting stops the server). The Tenant URL you give
      # Entra is this deployment's HTTPS public URL + /api/scim/v2, and the
      # Secret Token is SCIM_BEARER_TOKEN - generate one per deployment, at
      # least 32 characters. SCIM only updates users an OIDC login already
      # created; it never creates one.
      # - SCIM_TENANT_ID=00000000-0000-0000-0000-000000000000
      # - SCIM_BEARER_TOKEN=generate_a_random_secret_of_at_least_32_characters
    volumes:
      - ./iclib/library:/app/library
      # Optional: mount a directory containing your company logo for ECO PDFs
      # - ./iclib/image:/app/image
  
  iclib-db:
    image: postgres:18
    container_name: iclib-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=iclib
      - POSTGRES_PASSWORD=change-this-to-a-secure-db-password-minimum-6-characters
      - POSTGRES_DB=iclib
    volumes:
      - ./iclib/database:/var/lib/postgresql/18/docker
